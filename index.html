<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantis — Maintenance Information System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --color-bg:#FAFAFA;
  --color-surface:#FFFFFF;
  --color-border:#E5E7EB;
  --color-border-subtle:#F3F4F6;
  --color-primary:#023f88;
  --color-primary-hover:#012d63;
  --color-text:#111827;
  --color-text-muted:#6B7280;
  --color-text-dim:#9CA3AF;

  --gray-50:#F9FAFB;
  --gray-100:#F3F4F6;
  --gray-200:#E5E7EB;
  --gray-300:#D1D5DB;
  --gray-400:#9CA3AF;
  --gray-500:#6B7280;
  --gray-600:#4B5563;
  --gray-700:#374151;
  --gray-800:#1F2937;
  --gray-900:#111827;

  --blue-50:#EFF6FF; --blue-100:#DBEAFE; --blue-400:#60A5FA; --blue-600:#2563EB;
  --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-400:#FBBF24; --amber-600:#D97706;
  --green-50:#F0FDF4; --green-100:#DCFCE7; --green-400:#4ADE80; --green-600:#16A34A;
  --red-50:#FEF2F2; --red-100:#FEE2E2; --red-400:#F87171; --red-600:#DC2626;
  --purple-50:#FAF5FF; --purple-100:#F3E8FF; --purple-400:#C084FC; --purple-600:#9333EA;
  --orange-50:#FFF7ED; --orange-100:#FFEDD5; --orange-400:#FB923C; --orange-600:#EA580C;

  --radius-lg:0.5rem;
  --radius-xl:0.75rem;
  --radius-2xl:1rem;
  --radius-full:9999px;

  --font-sans:'Inter', system-ui, sans-serif;

  --sidebar-w:210px;
  --sidebar-w-collapsed:56px;
  --header-h:3.5rem;
}

*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#E5E7EB transparent;}
*::-webkit-scrollbar{width:4px;height:4px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:2px;}

html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
button, input{font-family:var(--font-sans);}
button{-webkit-tap-highlight-color:transparent;}

/* ===== App shell ===== */
.app{display:flex;height:100vh;overflow:hidden;background:var(--color-bg);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.1);z-index:40;display:none;}
.overlay--visible{display:block;}
@media (min-width:1025px){.overlay{display:none !important;}}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);
  height:100%;
  background:#fff;
  border-right:1px solid var(--color-border-subtle);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  transition:width .2s ease, transform .2s ease;
  z-index:50;
}
.sidebar--collapsed{width:var(--sidebar-w-collapsed);}
@media (max-width:1024px){
  .sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);width:var(--sidebar-w) !important;}
  .sidebar--open{transform:translateX(0);}
}

.sidebar__logo{display:flex;align-items:center;gap:0.75rem;height:var(--header-h);border-bottom:1px solid var(--color-border-subtle);padding:0 1rem;flex-shrink:0;}
.sidebar--collapsed .sidebar__logo{justify-content:center;padding:0;gap:0;}
.sidebar__logo-badge{width:1.75rem;height:1.75rem;border-radius:var(--radius-lg);background:var(--color-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar__logo-badge span{color:#fff;font-weight:700;font-size:11px;}
.sidebar__logo-text{min-width:0;}
.sidebar--collapsed .sidebar__logo-text{display:none;}
.sidebar__logo-title{font-size:0.875rem;font-weight:600;color:var(--gray-900);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__logo-sub{font-size:11px;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.sidebar__nav{flex:1;padding:0.75rem 0;overflow-y:auto;}
.sidebar__nav-item{width:100%;display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.75rem;text-align:left;position:relative;background:none;border:none;cursor:pointer;color:var(--gray-400);transition:color .15s,background-color .15s;}
.sidebar__nav-item:hover{color:var(--gray-700);background:var(--gray-50);}
.sidebar__nav-item--active{color:var(--color-primary);background:var(--blue-50);}
.sidebar__nav-item--active:hover{color:var(--color-primary);background:var(--blue-50);}
.sidebar--collapsed .sidebar__nav-item{justify-content:center;}
.sidebar__nav-icon{flex-shrink:0;display:flex;}
.sidebar__nav-label{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar--collapsed .sidebar__nav-label,.sidebar--collapsed .sidebar__nav-badge{display:none;}
.sidebar__nav-badge{font-size:11px;font-weight:500;background:var(--gray-200);color:var(--gray-600);border-radius:var(--radius-full);padding:1px 6px;min-width:1.25rem;text-align:center;}
.sidebar__nav-dot{display:none;position:absolute;top:0.5rem;right:0.5rem;width:6px;height:6px;border-radius:var(--radius-full);background:var(--gray-400);}
.sidebar--collapsed .sidebar__nav-item--has-badge .sidebar__nav-dot{display:block;}

.sidebar__bottom{border-top:1px solid var(--color-border-subtle);padding:0.75rem 0.5rem;display:flex;flex-direction:column;gap:2px;}
.sidebar--collapsed .sidebar__bottom{align-items:center;padding:0.75rem 0;}
.sidebar--collapsed .sidebar__collapse-label{display:none;}
.sidebar__bottom-btn{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;color:var(--gray-400);font-size:13px;background:none;border:none;border-radius:var(--radius-lg);cursor:pointer;width:100%;transition:color .15s,background-color .15s;}
.sidebar__bottom-btn:hover{color:var(--gray-600);background:var(--gray-50);}
.sidebar--collapsed .sidebar__bottom-btn{justify-content:center;}
.sidebar__collapse-btn{display:none;}
@media (min-width:1025px){.sidebar__collapse-btn{display:flex;}}
.sidebar__collapse-icon{transition:transform .2s;display:flex;}
.sidebar--collapsed .sidebar__collapse-icon{transform:rotate(180deg);}

/* ===== Main / Topbar ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

.topbar{height:var(--header-h);border-bottom:1px solid var(--color-border-subtle);background:#fff;display:flex;align-items:center;gap:1rem;padding:0 1.25rem;flex-shrink:0;}
.topbar__hamburger{display:flex;color:var(--gray-400);background:none;border:none;cursor:pointer;padding:0;}
.topbar__hamburger:hover{color:var(--gray-600);}
@media (min-width:1025px){.topbar__hamburger{display:none;}}
.topbar__breadcrumb{display:flex;align-items:center;gap:0.5rem;font-size:13px;color:var(--gray-400);white-space:nowrap;overflow:hidden;}
.topbar__breadcrumb-sep{color:var(--gray-200);}
.topbar__breadcrumb-current{color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar__spacer{flex:1;}
.topbar__search{position:relative;display:block;}
@media (max-width:767px){.topbar__search{display:none;}}
.topbar__search-icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--gray-400);pointer-events:none;display:flex;}
.topbar__search-input{background:var(--gray-50);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.375rem 0.75rem 0.375rem 2rem;font-size:13px;width:10rem;outline:none;transition:border-color .15s;color:var(--gray-800);}
.topbar__search-input::placeholder{color:var(--gray-300);}
.topbar__search-input:focus{border-color:var(--gray-400);}
.topbar__bell{position:relative;padding:0.5rem;border-radius:var(--radius-lg);color:var(--gray-400);background:none;border:none;cursor:pointer;display:flex;}
.topbar__bell:hover{color:var(--gray-600);background:var(--gray-50);}
.topbar__bell-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:var(--radius-full);background:var(--red-400);}
.topbar__avatar{width:1.75rem;height:1.75rem;border-radius:var(--radius-full);background:var(--gray-100);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background-color .15s;}
.topbar__avatar:hover{background:var(--gray-200);}
.topbar__avatar span{font-size:11px;font-weight:600;color:var(--gray-600);}

.content{flex:1;overflow-y:auto;padding:1.25rem;}
@media (min-width:1025px){.content{padding:1.75rem;}}

/* ===== Page common ===== */
.page{display:flex;flex-direction:column;gap:1.5rem;}
.page[hidden]{display:none;}
.page__header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.page__title{font-size:1.5rem;font-weight:600;color:var(--gray-900);letter-spacing:-0.01em;margin:0;}
.page__subtitle{font-size:0.875rem;color:var(--gray-400);margin:0.25rem 0 0;}

.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;background:var(--color-primary);color:#fff;font-weight:500;font-size:0.875rem;border-radius:var(--radius-xl);padding:0.625rem 1rem;border:none;cursor:pointer;transition:background-color .15s;white-space:nowrap;}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{padding:0.625rem 1rem;border:1px solid var(--color-border);color:var(--gray-600);font-size:0.875rem;border-radius:var(--radius-xl);background:#fff;cursor:pointer;transition:background-color .15s;}
.btn-secondary:hover{background:var(--gray-50);}

.icon{display:block;}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:0.375rem;border-radius:var(--radius-full);font-weight:500;white-space:nowrap;}
.badge--sm{padding:0.125rem 0.5rem;font-size:11px;}
.badge--md{padding:0.25rem 0.625rem;font-size:12px;}
.badge__dot{width:6px;height:6px;border-radius:var(--radius-full);flex-shrink:0;}

.badge--blue{background:var(--blue-50);color:var(--blue-600);border:1px solid var(--blue-100);}
.badge__dot--blue{background:var(--blue-400);}
.badge--amber{background:var(--amber-50);color:var(--amber-600);border:1px solid var(--amber-100);}
.badge__dot--amber{background:var(--amber-400);}
.badge--gray{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);}
.badge__dot--gray{background:var(--gray-400);}
.badge--green{background:var(--green-50);color:var(--green-600);border:1px solid var(--green-100);}
.badge__dot--green{background:var(--green-400);}
.badge--red{background:var(--red-50);color:var(--red-600);border:1px solid var(--red-100);}
.badge__dot--red{background:var(--red-400);}
.badge--purple{background:var(--purple-50);color:var(--purple-600);border:1px solid var(--purple-100);}
.badge__dot--purple{background:var(--purple-400);}
.badge--orange{background:var(--orange-50);color:var(--orange-600);border:1px solid var(--orange-100);}
.badge__dot--orange{background:var(--orange-400);}

/* ===== Filters row ===== */
.filters-row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;}
.search-box{position:relative;}
.search-box__icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--gray-400);display:flex;}
.search-box__input{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.5rem 0.75rem 0.5rem 2rem;font-size:0.875rem;color:var(--gray-700);outline:none;transition:border-color .15s;}
.search-box__input::placeholder{color:var(--gray-300);}
.search-box__input:focus{border-color:var(--gray-400);}
.filters-divider{width:1px;height:1rem;background:var(--color-border);}
.filter-chip{font-size:12px;padding:0.375rem 0.75rem;border-radius:var(--radius-lg);border:1px solid var(--color-border);color:var(--gray-500);background:#fff;cursor:pointer;text-transform:capitalize;transition:border-color .15s,color .15s,background-color .15s;white-space:nowrap;}
.filter-chip:hover{border-color:var(--gray-300);color:var(--gray-700);}
.filter-chip--active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.filter-chip--active:hover{color:#fff;border-color:var(--color-primary);}
.cat-scroll{display:flex;gap:0.375rem;overflow-x:auto;padding-bottom:2px;}

/* ===== Tables ===== */
.table-wrap{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);overflow:hidden;}
.table-scroll{overflow-x:auto;}
.table__head{display:grid;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);font-weight:500;padding:0.75rem 1.5rem;border-bottom:1px solid var(--gray-50);min-width:640px;}
.table__row{display:grid;padding:1rem 1.5rem;align-items:center;cursor:pointer;transition:background-color .15s;border-bottom:1px solid var(--gray-50);min-width:640px;}
.table__row:last-child{border-bottom:none;}
.table__row:hover{background:var(--gray-50);}
.table__body{display:flex;flex-direction:column;}

.wo-table__head,.wo-table__row{grid-template-columns:5.5rem minmax(0,1fr) minmax(0,1fr) 5rem 5.5rem 5.5rem 4.5rem 1.5rem;}
.parts-table__head,.parts-table__row{grid-template-columns:5rem minmax(0,1fr) 8rem 6rem 5rem 6rem 6rem;}
.po-table__head,.po-table__row{grid-template-columns:5rem minmax(0,1fr) minmax(0,1fr) 4rem 6rem 6rem 1.5rem;}
.teams-table__head,.teams-table__row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 6rem 6rem;}

.cell-dim{color:var(--gray-400);font-size:12px;}
.cell-title{font-size:0.875rem;font-weight:500;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub{font-size:0.875rem;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub-dim{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-text{font-size:12px;color:var(--gray-500);}
.text-right{text-align:right;}
.text-center{text-align:center;}
.chevron-cell{color:var(--gray-300);transition:color .15s;justify-self:end;display:flex;}
.table__row:hover .chevron-cell{color:var(--gray-600);}

/* ===== KPI cards (dashboard) ===== */
.grid-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
@media (min-width:1025px){.grid-kpi{grid-template-columns:repeat(3,1fr);}}
.kpi-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;transition:border-color .15s;}
.kpi-card:hover{border-color:var(--color-border);}
.kpi-card__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.kpi-card__label{font-size:11px;font-weight:500;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;}
.kpi-card__icon{padding:0.5rem;border-radius:var(--radius-xl);display:flex;}
.kpi-card__value{font-size:1.875rem;font-weight:600;color:var(--gray-900);}
.kpi-card__sub{font-size:12px;color:var(--gray-400);margin-top:0.25rem;}

.live-pill{display:inline-flex;align-items:center;gap:0.5rem;font-size:12px;color:var(--green-600);background:var(--green-50);border:1px solid var(--green-100);padding:0.375rem 0.75rem;border-radius:var(--radius-full);flex-shrink:0;}
.live-pill__dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--green-400);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.dash-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;}
@media (min-width:1025px){.dash-grid{grid-template-columns:2fr 1fr;}}
.dash-grid__side{display:flex;flex-direction:column;gap:1rem;}

.panel{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);overflow:hidden;}
.panel--flex{flex:1;}
.panel__header{padding:1rem 1.5rem;border-bottom:1px solid var(--gray-50);display:flex;align-items:center;justify-content:space-between;gap:0.5rem;}
.panel__header--sm{padding:1rem 1.25rem;}
.panel__header-title{font-size:0.875rem;font-weight:600;color:var(--gray-900);}
.panel__header-sub{font-size:12px;color:var(--gray-400);}

.wo-mini-row{padding:0.875rem 1.5rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:background-color .15s;border-bottom:1px solid var(--gray-50);}
.wo-mini-row:last-child{border-bottom:none;}
.wo-mini-row:hover{background:var(--gray-50);}
.wo-mini-row__id{font-size:12px;color:var(--gray-400);width:4.5rem;flex-shrink:0;}
.wo-mini-row__main{flex:1;min-width:0;}
.wo-mini-row__title{font-size:0.875rem;font-weight:500;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wo-mini-row__meta{font-size:12px;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wo-mini-row__due{font-size:12px;color:var(--gray-400);flex-shrink:0;}

.mini-row{padding:0.75rem 1.25rem;cursor:pointer;transition:background-color .15s;border-bottom:1px solid var(--gray-50);}
.mini-row:last-child{border-bottom:none;}
.mini-row:hover{background:var(--gray-50);}
.mini-row__title{font-size:12px;font-weight:500;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-row__bottom{display:flex;align-items:center;justify-content:space-between;margin-top:0.25rem;gap:0.5rem;}
.mini-row__sub{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.asset-status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;}
@media (min-width:640px){.asset-status-grid{grid-template-columns:repeat(4,1fr);}}
.asset-status-item{display:flex;flex-direction:column;gap:0.5rem;}
.asset-status-count{font-size:1.875rem;font-weight:600;color:var(--gray-900);}
.asset-status-label{font-size:12px;color:var(--gray-400);}

.section-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.5rem;}
.section-card__title{font-size:0.875rem;font-weight:600;color:var(--gray-900);margin:0 0 1.25rem;}

/* ===== Stat cards ===== */
.stat-row{display:grid;gap:1rem;}
.stat-row--3{grid-template-columns:repeat(3,1fr);}
.stat-row--4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){.stat-row--3{grid-template-columns:repeat(2,1fr);}.stat-row--4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:420px){.stat-row--3{grid-template-columns:1fr;}.stat-row--4{grid-template-columns:1fr;}}
.stat-card{border-radius:var(--radius-2xl);padding:1.25rem;border:1px solid;}
.stat-card__count{font-size:1.875rem;font-weight:600;}
.stat-card__label{font-size:0.875rem;color:var(--gray-500);margin-top:0.25rem;}
.stat-card--red{background:var(--red-50);border-color:var(--red-100);}
.stat-card--red .stat-card__count{color:var(--red-600);}
.stat-card--amber{background:var(--amber-50);border-color:var(--amber-100);}
.stat-card--amber .stat-card__count{color:var(--amber-600);}
.stat-card--blue{background:var(--blue-50);border-color:var(--blue-100);}
.stat-card--blue .stat-card__count{color:var(--blue-600);}
.stat-card--green{background:var(--green-50);border-color:var(--green-100);}
.stat-card--green .stat-card__count{color:var(--green-600);}
.stat-card--purple{background:var(--purple-50);border-color:var(--purple-100);}
.stat-card--purple .stat-card__count{color:var(--purple-600);}

/* ===== Card grid (PM / Assets / Meters / People) ===== */
.cards-2col{display:grid;grid-template-columns:1fr;gap:1rem;}
@media (min-width:1025px){.cards-2col{grid-template-columns:repeat(2,1fr);}}

.pm-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;cursor:pointer;transition:border-color .15s;}
.pm-card:hover{border-color:var(--color-border);}
.pm-card__id-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;}
.pm-card__id{font-size:12px;color:var(--gray-400);}
.pm-card__title{font-size:0.875rem;font-weight:600;color:var(--gray-800);line-height:1.375;}
.pm-card__asset{font-size:12px;color:var(--gray-400);margin-top:2px;}
.pm-card__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding-top:1rem;border-top:1px solid var(--gray-50);margin-top:1rem;}
.pm-card__field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:0.25rem;}
.pm-card__field-value{font-size:0.875rem;color:var(--gray-700);}
.pm-card__field-value--overdue{color:var(--red-600);font-weight:500;}
.pm-card__icon-row{display:flex;align-items:center;gap:0.375rem;color:var(--gray-400);}
.pm-card__footer{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-400);margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--gray-50);}

.asset-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;cursor:pointer;transition:border-color .15s;}
.asset-card:hover{border-color:var(--color-border);}

}

  const btn = e.target.closest('.sidebar__nav-item');
  if(!btn) return;
  setPage(btn.getAttribute('data-page'));
  closeMobileSidebar();
});

function setPage(id){
  if(state.page === id) return;
  state.page = id;
  renderSidebarNav();
  document.querySelectorAll('.page').forEach(function(p){ p.hidden = (p.id !== 'page-'+id); });
  const navItem = NAV.find(function(n){ return n.id === id; });
  breadcrumbCurrent.textContent = navItem ? navItem.label : '';
  document.getElementById('content').scrollTop = 0;
}

  state.mobileOpen = true;
  sidebar.classList.add('sidebar--open');
  mobileOverlay.classList.add('overlay--visible');

}

  state.mobileOpen = false;
  sidebar.classList.remove('sidebar--open');
  mobileOverlay.classList.remove('overlay--visible');
  hamburgerBtn.setAttribute('aria-expanded','false');
}

  state.mobileOpen ? closeMobileSidebar() : openMobileSidebar();
});

const PO_STATUSES = ['all','pending-approval','ordered','partial','received'];

function renderPurchaseOrdersPage(){
  const grandTotal = purchaseOrders.reduce(function(s,p){ return s+p.total; }, 0);
  const totalSpend = purchaseOrders.filter(function(p){return p.status==='received';}).reduce(function(s,p){ return s+p.total; }, 0);

  const stats = [
    { label:'Pending Approval', count: purchaseOrders.filter(function(p){return p.status==='pending-approval';}).length, cls:'purple' },
    { label:'Ordered', count: purchaseOrders.filter(function(p){return p.status==='ordered';}).length, cls:'blue' },
    { label:'Partial', count: purchaseOrders.filter(function(p){return p.status==='partial';}).length, cls:'amber' },
    { label:'Received', count: purchaseOrders.filter(function(p){return p.status==='received';}).length, cls:'green' },
  ];
  const statsHtml = stats.map(function(s){
    return '<div class="stat-card stat-card--'+s.cls+'"><div class="stat-card__count">'+s.count+'</div><div class="stat-card__label">'+s.label+'</div></div>';
  }).join('');

  const statusChips = PO_STATUSES.map(function(s){
    return '<button type="button" class="filter-chip'+(state.po.status===s?' filter-chip--active':'')+'" data-action="po-status" data-value="'+s+'">'+s+'</button>';
  }).join('');

  const vendorTotals = [];
  purchaseOrders.forEach(function(po){
    const found = vendorTotals.find(function(v){ return v.vendor===po.vendor; });
    if(found) found.total += po.total; else vendorTotals.push({ vendor: po.vendor, total: po.total });
  });
  vendorTotals.sort(function(a,b){ return b.total - a.total; });
  const vendorHtml = vendorTotals.map(function(v,i){
    const pct = Math.round((v.total/grandTotal)*100);
    return '<div class="vendor-row">'
      + '<span class="vendor-rank">'+(i+1)+'</span>'
      + '<span class="vendor-name">'+esc(v.vendor)+'</span>'
      + '<div class="vendor-bar"><div class="vendor-bar__fill" style="width:'+pct+'%"></div></div>'
      + '<span class="vendor-total">'+fmtMoney(v.total)+'</span>'
      + '</div>';
  }).join('');

  return '<div class="page__header">'
    + '<div><h1 class="page__title">Purchase Orders</h1><p class="page__subtitle">'+purchaseOrders.length+' orders · '+fmtMoney(totalSpend)+' received MTD</p></div>'
    + '<button type="button" class="btn-primary">'+icon('plus',14)+' New PO</button>'
    + '</div>'
    + '<div class="stat-row stat-row--4">'+statsHtml+'</div>'
    + '<div class="filters-row" id="poStatusChips">'+statusChips+'</div>'
    + '<div class="table-wrap"><div class="table-scroll">'
    +   '<div class="table__head po-table__head"><span>PO #</span><span>Vendor</span><span>Requested By</span><span class="text-center">Items</span><span class="text-right">Total</span><span>Status</span><span></span></div>'
    +   '<div class="table__body" id="poTableBody"></div>'
    + '</div></div>'
    + '<div class="section-card">'
    +   '<div class="section-card__title">Spend by Vendor</div>'
    +   '<div class="vendor-list">'+vendorHtml+'</div>'
    + '</div>';
}

function filteredPO(){
  const f = state.po;
  return purchaseOrders.filter(function(po){ return f.status==='all' || po.status===f.status; });

/* PM page */
const pmPage = document.getElementById('page-pm');
pmPage.addEventListener('click', function(e){
  const chip = e.target.closest('[data-action="pm-freq"]');
  if(chip){
    state.pm.freq = chip.getAttribute('data-value');
    document.querySelectorAll('#pmFreqChips .filter-chip').forEach(function(c){ c.classList.toggle('filter-chip--active', c===chip); });
    updatePMList();
  }
});
document.getElementById('pmSearch').addEventListener('input', function(e){
  state.pm.search = e.target.value;
  updatePMList();
});

/* Assets page */
const assetsPage = document.getElementById('page-assets');
assetsPage.addEventListener('click', function(e){
  const critChip = e.target.closest('[data-action="assets-crit"]');
  if(critChip){
    state.assets.crit = critChip.getAttribute('data-value');
    document.querySelectorAll('#assetsCritChips .filter-chip').forEach(function(c){ c.classList.toggle('filter-chip--active', c===critChip); });
    updateAssetsList();
    return;
  }
  const catChip = e.target.closest('[data-action="assets-cat"]');
  if(catChip){
    state.assets.cat = catChip.getAttribute('data-value');
    document.querySelectorAll('#assetsCatChips .cat-chip').forEach(function(c){ c.classList.toggle('cat-chip--active', c===catChip); });
    updateAssetsList();
  }
});
document.getElementById('assetsSearch').addEventListener('input', function(e){
  state.assets.search = e.target.value;
  updateAssetsList();
});

/* People & Teams page */
const peoplePage = document.getElementById('page-people');
peoplePage.addEventListener('click', function(e){
  const tabBtn = e.target.closest('[data-action="people-tab"]');
  if(tabBtn){
    state.people.tab = tabBtn.getAttribute('data-value');
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('tab-btn--active', b===tabBtn); });
    document.getElementById('peopleTabPanel').hidden = state.people.tab !== 'people';
    document.getElementById('teamsTabPanel').hidden = state.people.tab !== 'teams';
  }
});

/* Meters page */
const metersPage = document.getElementById('page-meters');
metersPage.addEventListener('click', function(e){
  const toggleBtn = e.target.closest('[data-action="meter-toggle-add"]');
  if(toggleBtn){
    const wrap = toggleBtn.closest('.meter-card__enter-wrap');
    toggleBtn.hidden = true;
    const form = wrap.querySelector('.meter-card__add-form');
    form.hidden = false;
    form.querySelector('input').focus();
    return;
  }
  const saveBtn = e.target.closest('[data-action="meter-save"]');
  const cancelBtn = e.target.closest('[data-action="meter-cancel"]');
  if(saveBtn || cancelBtn){
    const wrap = (saveBtn||cancelBtn).closest('.meter-card__enter-wrap');
    wrap.querySelector('.meter-card__add-form').hidden = true;
    wrap.querySelector('[data-action="meter-toggle-add"]').hidden = false;
  }
});

})();
</script>
</body>
</html>
