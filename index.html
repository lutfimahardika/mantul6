<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantis — Maintenance Information System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --color-bg:#FAFAFA;
  --color-surface:#FFFFFF;
  --color-border:#E5E7EB;
  --color-border-subtle:#F3F4F6;
  --color-primary:#155eef;
  --color-primary-hover:#0b3d91;
  --color-text:#111827;
  --color-text-muted:#6B7280;
  --color-text-dim:#9CA3AF;

  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563; --gray-700:#374151;
  --gray-800:#1F2937; --gray-900:#111827;

  --blue-50:#EFF6FF; --blue-100:#DBEAFE; --blue-400:#60A5FA; --blue-600:#2563EB;
  --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-400:#FBBF24; --amber-600:#D97706;
  --green-50:#F0FDF4; --green-100:#DCFCE7; --green-400:#4ADE80; --green-600:#16A34A;
  --red-50:#FEF2F2; --red-100:#FEE2E2; --red-400:#F87171; --red-600:#DC2626;
  --purple-50:#FAF5FF; --purple-100:#F3E8FF; --purple-400:#C084FC; --purple-600:#9333EA;
  --orange-50:#FFF7ED; --orange-100:#FFEDD5; --orange-400:#FB923C; --orange-600:#EA580C;

  --radius-lg:0.5rem; --radius-xl:0.75rem; --radius-2xl:1rem; --radius-full:9999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --font-sans:'Inter', system-ui, sans-serif;
  --sidebar-w:220px; --sidebar-w-collapsed:56px; --header-h:3.5rem;
}

*{box-sizing:border-box; margin:0; padding:0; scrollbar-width:thin; scrollbar-color:#E5E7EB transparent;}
*::-webkit-scrollbar{width:4px;height:4px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:2px;}

html,body{height:100%;}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;}
button,input,select,textarea{font-family:var(--font-sans);}
button{-webkit-tap-highlight-color:transparent;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{animation:spin .8s linear infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ===== App shell ===== */
.app{display:flex;height:100vh;overflow:hidden;background:var(--color-bg);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.1);z-index:40;display:none;}
.overlay--visible{display:block;}
@media (min-width:1025px){.overlay{display:none !important;}}

/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);height:100%;background:#fff;border-right:1px solid var(--color-border-subtle);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s ease, transform .2s ease;z-index:50;}
.sidebar--collapsed{width:var(--sidebar-w-collapsed);}
@media (max-width:1024px){.sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);width:var(--sidebar-w) !important;}.sidebar--open{transform:translateX(0);}}

.sidebar__logo{display:flex;align-items:center;gap:0.75rem;height:var(--header-h);border-bottom:1px solid var(--color-border-subtle);padding:0 1rem;flex-shrink:0;}
.sidebar--collapsed .sidebar__logo{justify-content:center;padding:0;gap:0;}
.sidebar__logo-badge{width:1.75rem;height:1.75rem;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--color-primary),#0b3d91);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar__logo-badge span{color:#fff;font-weight:700;font-size:11px;}
.sidebar__logo-text{min-width:0;}
.sidebar--collapsed .sidebar__logo-text{display:none;}
.sidebar__logo-title{font-size:0.875rem;font-weight:700;color:var(--gray-900);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__logo-sub{font-size:11px;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.sidebar__nav{flex:1;padding:0.75rem 0;overflow-y:auto;}
.sidebar__nav-item{width:100%;display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.75rem;text-align:left;position:relative;background:none;border:none;cursor:pointer;color:var(--gray-400);transition:color .15s,background-color .15s;}
.sidebar__nav-item:hover{color:var(--gray-700);background:var(--gray-50);}
.sidebar__nav-item--active{color:var(--color-primary);background:var(--blue-50);}
.sidebar__nav-item--active:hover{color:var(--color-primary);background:var(--blue-50);}
.sidebar--collapsed .sidebar__nav-item{justify-content:center;}
.sidebar__nav-icon{flex-shrink:0;display:flex;}
.sidebar__nav-label{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar--collapsed .sidebar__nav-label,.sidebar--collapsed .sidebar__nav-badge{display:none;}
.sidebar__nav-badge{font-size:11px;font-weight:600;background:var(--gray-200);color:var(--gray-600);border-radius:var(--radius-full);padding:1px 6px;min-width:1.25rem;text-align:center;}
.sidebar__nav-item--active .sidebar__nav-badge{background:var(--blue-100);color:var(--color-primary);}

.sidebar__bottom{border-top:1px solid var(--color-border-subtle);padding:0.75rem 0.5rem;display:flex;flex-direction:column;gap:2px;}
.sidebar--collapsed .sidebar__bottom{align-items:center;padding:0.75rem 0;}
.sidebar--collapsed .sidebar__collapse-label{display:none;}
.sidebar__bottom-btn{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;color:var(--gray-400);font-size:13px;background:none;border:none;border-radius:var(--radius-lg);cursor:pointer;width:100%;transition:color .15s,background-color .15s;}
.sidebar__bottom-btn:hover{color:var(--gray-600);background:var(--gray-50);}
.sidebar--collapsed .sidebar__bottom-btn{justify-content:center;}
.sidebar__collapse-btn{display:none;}
@media (min-width:1025px){.sidebar__collapse-btn{display:flex;}}
.sidebar__collapse-icon{transition:transform .2s;display:flex;}
.sidebar--collapsed .sidebar__collapse-icon{transform:rotate(180deg);}

/* ===== Main / Topbar ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{height:var(--header-h);border-bottom:1px solid var(--color-border-subtle);background:#fff;display:flex;align-items:center;gap:1rem;padding:0 1.25rem;flex-shrink:0;}
.topbar__hamburger{display:flex;color:var(--gray-400);background:none;border:none;cursor:pointer;padding:0;}
.topbar__hamburger:hover{color:var(--gray-600);}
@media (min-width:1025px){.topbar__hamburger{display:none;}}
.topbar__breadcrumb{display:flex;align-items:center;gap:0.5rem;font-size:13px;color:var(--gray-400);white-space:nowrap;overflow:hidden;}
.topbar__breadcrumb-sep{color:var(--gray-200);}
.topbar__breadcrumb-current{color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar__spacer{flex:1;}
.topbar__search{position:relative;display:block;}
@media (max-width:767px){.topbar__search{display:none;}}
.topbar__search-icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--gray-400);pointer-events:none;display:flex;}
.topbar__search-input{background:var(--gray-50);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.375rem 0.75rem 0.375rem 2rem;font-size:13px;width:11rem;outline:none;transition:border-color .15s;color:var(--gray-800);}
.topbar__search-input::placeholder{color:var(--gray-300);}
.topbar__search-input:focus{border-color:var(--gray-400);}
.topbar__bell{position:relative;padding:0.5rem;border-radius:var(--radius-lg);color:var(--gray-400);background:none;border:none;cursor:pointer;display:flex;}
.topbar__bell:hover{color:var(--gray-600);background:var(--gray-50);}
.topbar__bell-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:var(--radius-full);background:var(--red-400);}
.topbar__avatar{width:1.75rem;height:1.75rem;border-radius:var(--radius-full);background:var(--gray-100);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background-color .15s;}
.topbar__avatar:hover{background:var(--gray-200);}
.topbar__avatar span{font-size:11px;font-weight:600;color:var(--gray-600);}

.content{flex:1;overflow-y:auto;padding:1.25rem;}
@media (min-width:1025px){.content{padding:1.75rem;}}

/* ===== Page common ===== */
.page{display:flex;flex-direction:column;gap:1.5rem;}
.page[hidden]{display:none;}
.page__header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.page__title{font-size:1.5rem;font-weight:700;color:var(--gray-900);letter-spacing:-0.01em;}
.page__subtitle{font-size:0.875rem;color:var(--gray-400);margin-top:0.25rem;}

.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;background:var(--color-primary);color:#fff;font-weight:600;font-size:0.875rem;border-radius:var(--radius-xl);padding:0.625rem 1rem;border:none;cursor:pointer;transition:background-color .15s;white-space:nowrap;}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-secondary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.625rem 1rem;border:1px solid var(--color-border);color:var(--gray-600);font-size:0.875rem;font-weight:500;border-radius:var(--radius-xl);background:#fff;cursor:pointer;transition:background-color .15s;white-space:nowrap;}
.btn-secondary:hover{background:var(--gray-50);}
.btn-secondary.spin i, .btn-secondary .spin{display:inline-flex;}
.icon{display:block;}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:0.375rem;border-radius:var(--radius-full);font-weight:600;white-space:nowrap;}
.badge--sm{padding:0.125rem 0.5rem;font-size:11px;}
.badge--md{padding:0.25rem 0.625rem;font-size:12px;}
.badge__dot{width:6px;height:6px;border-radius:var(--radius-full);flex-shrink:0;}
.badge--blue{background:var(--blue-50);color:var(--blue-600);border:1px solid var(--blue-100);} .badge__dot--blue{background:var(--blue-400);}
.badge--amber{background:var(--amber-50);color:var(--amber-600);border:1px solid var(--amber-100);} .badge__dot--amber{background:var(--amber-400);}
.badge--gray{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);} .badge__dot--gray{background:var(--gray-400);}
.badge--green{background:var(--green-50);color:var(--green-600);border:1px solid var(--green-100);} .badge__dot--green{background:var(--green-400);}
.badge--red{background:var(--red-50);color:var(--red-600);border:1px solid var(--red-100);} .badge__dot--red{background:var(--red-400);}
.badge--purple{background:var(--purple-50);color:var(--purple-600);border:1px solid var(--purple-100);} .badge__dot--purple{background:var(--purple-400);}
.badge--orange{background:var(--orange-50);color:var(--orange-600);border:1px solid var(--orange-100);} .badge__dot--orange{background:var(--orange-400);}

/* ===== Filters ===== */
.filters-row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;}
.search-box{position:relative;}
.search-box__icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--gray-400);display:flex;}
.search-box__input{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.5rem 0.75rem 0.5rem 2rem;font-size:0.875rem;color:var(--gray-700);outline:none;transition:border-color .15s;}
.search-box__input::placeholder{color:var(--gray-300);}
.search-box__input:focus{border-color:var(--gray-400);}
.filters-divider{width:1px;height:1rem;background:var(--color-border);}
.filter-chip{font-size:12px;padding:0.375rem 0.75rem;border-radius:var(--radius-lg);border:1px solid var(--color-border);color:var(--gray-500);background:#fff;cursor:pointer;text-transform:capitalize;transition:border-color .15s,color .15s,background-color .15s;white-space:nowrap;font-weight:500;}
.filter-chip:hover{border-color:var(--gray-300);color:var(--gray-700);}
.filter-chip--active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.filter-chip--active:hover{color:#fff;border-color:var(--color-primary);}
.cat-scroll{display:flex;gap:0.375rem;overflow-x:auto;padding-bottom:2px;}

/* ===== Tables ===== */
.table-wrap{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);overflow:hidden;}
.table-scroll{overflow-x:auto;}
.table__head{display:grid;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);font-weight:600;padding:0.75rem 1.5rem;border-bottom:1px solid var(--gray-50);min-width:640px;}
.table__head span{cursor:default;user-select:none;}
.table__head span[data-sort]{cursor:pointer;}
.table__head span.sorted{color:var(--color-primary);}
.sort-icon{font-size:9px;margin-left:3px;opacity:.35;}
.sorted .sort-icon{opacity:1;}
.table__row{display:grid;padding:1rem 1.5rem;align-items:center;cursor:pointer;transition:background-color .15s;border-bottom:1px solid var(--gray-50);min-width:640px;}
.table__row:last-child{border-bottom:none;}
.table__row:hover{background:var(--gray-50);}
.table__body{display:flex;flex-direction:column;}

.wo-table__head,.wo-table__row{grid-template-columns:5.5rem minmax(0,1fr) minmax(0,1fr) 5rem 5.5rem 5.5rem 4.5rem 1.5rem;}
.teams-table__head,.teams-table__row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 6rem 6rem;}
.sparepart-table__head,.sparepart-table__row{grid-template-columns:6rem minmax(0,1fr) 9rem 6rem 7rem 6rem;}
.popr-table__head,.popr-table__row{grid-template-columns:6.5rem 6.5rem minmax(0,1fr) 5rem 6rem 7rem;}

.cell-dim{color:var(--gray-400);font-size:12px;}
.cell-title{font-size:0.875rem;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub{font-size:0.875rem;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub-dim{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-text{font-size:12px;color:var(--gray-500);}
.text-right{text-align:right;}
.text-center{text-align:center;}
.chevron-cell{color:var(--gray-300);transition:color .15s;justify-self:end;display:flex;}
.table__row:hover .chevron-cell{color:var(--gray-600);}
mark{background:#fef9c3;color:inherit;border-radius:2px;padding:0 1px;}

/* ===== KPI cards ===== */
.grid-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
@media (min-width:1025px){.grid-kpi{grid-template-columns:repeat(3,1fr);}}
.kpi-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;transition:border-color .15s;}
.kpi-card:hover{border-color:var(--color-border);}
.kpi-card__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.kpi-card__label{font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;}
.kpi-card__icon{padding:0.5rem;border-radius:var(--radius-xl);display:flex;}
.kpi-card__value{font-size:1.875rem;font-weight:700;color:var(--gray-900);}
.kpi-card__sub{font-size:12px;color:var(--gray-400);margin-top:0.25rem;}

.live-pill{display:inline-flex;align-items:center;gap:0.5rem;font-size:12px;color:var(--green-600);background:var(--green-50);border:1px solid var(--green-100);padding:0.375rem 0.75rem;border-radius:var(--radius-full);flex-shrink:0;font-weight:600;}
.live-pill__dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--green-400);animation:pulse 2s infinite;}

.dash-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;}
@media (min-width:1025px){.dash-grid{grid-template-columns:2fr 1fr;}}
.dash-grid__side{display:flex;flex-direction:column;gap:1rem;}

.panel{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);overflow:hidden;}
.panel--flex{flex:1;}
.panel__header{padding:1rem 1.5rem;border-bottom:1px solid var(--gray-50);display:flex;align-items:center;justify-content:space-between;gap:0.5rem;}
.panel__header--sm{padding:1rem 1.25rem;}
.panel__header-title{font-size:0.875rem;font-weight:700;color:var(--gray-900);}
.panel__header-sub{font-size:12px;color:var(--gray-400);}
.panel__empty{padding:1.5rem 1.25rem;font-size:12px;color:var(--gray-400);text-align:center;}

.wo-mini-row{padding:0.875rem 1.5rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:background-color .15s;border-bottom:1px solid var(--gray-50);}
.wo-mini-row:last-child{border-bottom:none;}
.wo-mini-row:hover{background:var(--gray-50);}
.wo-mini-row__id{font-size:12px;color:var(--gray-400);width:4.5rem;flex-shrink:0;}
.wo-mini-row__main{flex:1;min-width:0;}
.wo-mini-row__title{font-size:0.875rem;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wo-mini-row__meta{font-size:12px;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wo-mini-row__due{font-size:12px;color:var(--gray-400);flex-shrink:0;}

.mini-row{padding:0.75rem 1.25rem;cursor:default;transition:background-color .15s;border-bottom:1px solid var(--gray-50);}
.mini-row:last-child{border-bottom:none;}
.mini-row:hover{background:var(--gray-50);}
.mini-row__title{font-size:12px;font-weight:600;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-row__bottom{display:flex;align-items:center;justify-content:space-between;margin-top:0.25rem;gap:0.5rem;}
.mini-row__sub{font-size:12px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.asset-status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;}
@media (min-width:640px){.asset-status-grid{grid-template-columns:repeat(4,1fr);}}
.asset-status-item{display:flex;flex-direction:column;gap:0.5rem;}
.asset-status-count{font-size:1.875rem;font-weight:700;color:var(--gray-900);}
.asset-status-label{font-size:12px;color:var(--gray-400);}

.section-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.5rem;}
.section-card__title{font-size:0.875rem;font-weight:700;color:var(--gray-900);margin:0 0 1.25rem;}

/* ===== Stat cards ===== */
.stat-row{display:grid;gap:1rem;}
.stat-row--3{grid-template-columns:repeat(3,1fr);}
.stat-row--4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){.stat-row--3{grid-template-columns:repeat(2,1fr);}.stat-row--4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:420px){.stat-row--3{grid-template-columns:1fr;}.stat-row--4{grid-template-columns:1fr;}}
.stat-card{border-radius:var(--radius-2xl);padding:1.25rem;border:1px solid;}
.stat-card__count{font-size:1.875rem;font-weight:700;}
.stat-card__label{font-size:0.875rem;color:var(--gray-500);margin-top:0.25rem;}
.stat-card--red{background:var(--red-50);border-color:var(--red-100);} .stat-card--red .stat-card__count{color:var(--red-600);}
.stat-card--amber{background:var(--amber-50);border-color:var(--amber-100);} .stat-card--amber .stat-card__count{color:var(--amber-600);}
.stat-card--blue{background:var(--blue-50);border-color:var(--blue-100);} .stat-card--blue .stat-card__count{color:var(--blue-600);}
.stat-card--green{background:var(--green-50);border-color:var(--green-100);} .stat-card--green .stat-card__count{color:var(--green-600);}
.stat-card--purple{background:var(--purple-50);border-color:var(--purple-100);} .stat-card--purple .stat-card__count{color:var(--purple-600);}

/* ===== Card grids ===== */
.cards-2col{display:grid;grid-template-columns:1fr;gap:1rem;}
.cards-2col[hidden]{display:none;}
@media (min-width:1025px){.cards-2col{grid-template-columns:repeat(2,1fr);}}

.pm-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;transition:border-color .15s;}
.pm-card:hover{border-color:var(--color-border);}
.pm-card__id-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;flex-wrap:wrap;}
.pm-card__id{font-size:12px;color:var(--gray-400);}
.pm-card__title{font-size:0.875rem;font-weight:700;color:var(--gray-800);line-height:1.375;}
.pm-card__asset{font-size:12px;color:var(--gray-400);margin-top:2px;}
.pm-card__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding-top:1rem;border-top:1px solid var(--gray-50);margin-top:1rem;}
.pm-card__field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:0.25rem;}
.pm-card__field-value{font-size:0.875rem;color:var(--gray-700);}
.pm-card__field-value--overdue{color:var(--red-600);font-weight:700;}
.pm-card__icon-row{display:flex;align-items:center;gap:0.375rem;color:var(--gray-400);}
.pm-card__footer{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-400);margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--gray-50);}

.asset-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;transition:border-color .15s;}
.asset-card:hover{border-color:var(--color-border);}
.asset-card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;margin-bottom:1rem;}
.asset-card__id-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;flex-wrap:wrap;}
.asset-card__id{font-size:12px;color:var(--gray-400);}
.asset-card__name{font-size:0.875rem;font-weight:700;color:var(--gray-800);}
.asset-card__location{font-size:12px;color:var(--gray-400);margin-top:2px;}
.asset-card__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem 0.75rem;border-top:1px solid var(--gray-50);padding-top:1rem;}
.asset-card__field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:2px;}
.asset-card__field-value{font-size:12px;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.meter-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.5rem;transition:border-color .15s;display:flex;flex-direction:column;gap:1.25rem;}
.meter-card:hover{border-color:var(--color-border);}
.meter-card__top{display:flex;align-items:flex-start;justify-content:space-between;}
.meter-card__id-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;flex-wrap:wrap;}
.meter-card__id{font-size:12px;color:var(--gray-400);}
.meter-card__name{font-size:0.875rem;font-weight:700;color:var(--gray-800);cursor:pointer;}
.meter-card__name:hover{color:var(--color-primary);}
.meter-card__asset{font-size:12px;color:var(--gray-400);margin-top:2px;}
.meter-card__icon{color:var(--gray-300);margin-top:0.25rem;display:flex;cursor:pointer;}
.meter-card__icon:hover{color:var(--color-primary);}
.meter-card__reading-box{background:var(--gray-50);border-radius:var(--radius-xl);padding:1rem 1.25rem;}
.meter-card__reading-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:0.25rem;}
.meter-card__reading-value{display:flex;align-items:baseline;gap:0.5rem;}
.meter-card__reading-num{font-size:1.5rem;font-weight:700;color:var(--gray-900);}
.meter-card__reading-unit{font-size:0.875rem;color:var(--gray-400);}
.meter-card__reading-rate{font-size:12px;color:var(--gray-400);margin-top:0.25rem;}
.meter-card__add-btn{font-size:12px;color:var(--gray-500);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.5rem 1rem;background:#fff;cursor:pointer;align-self:flex-start;transition:color .15s,border-color .15s;font-weight:600;}
.meter-card__add-btn:hover{color:var(--gray-800);border-color:var(--gray-300);}
.meter-card__add-form{display:flex;gap:0.5rem;flex-wrap:wrap;}
.meter-card__add-form[hidden]{display:none;}
.meter-card__add-label{font-size:11px;font-weight:600;color:var(--gray-500);width:100%;}
.meter-card__add-input{flex:1;min-width:6rem;background:var(--gray-50);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.5rem 0.75rem;font-size:0.875rem;color:var(--gray-800);outline:none;}
.meter-card__add-input::placeholder{color:var(--gray-300);}
.meter-card__add-input:focus{border-color:var(--gray-400);}
.meter-card__save-btn{padding:0.5rem 0.75rem;background:var(--gray-900);color:#fff;font-size:12px;font-weight:600;border-radius:var(--radius-xl);border:none;cursor:pointer;}
.meter-card__save-btn:hover{background:var(--gray-700);}
.meter-card__cancel-btn{padding:0.5rem 0.75rem;border:1px solid var(--color-border);color:var(--gray-500);font-size:12px;border-radius:var(--radius-xl);background:#fff;cursor:pointer;}
.meter-card__cancel-btn:hover{background:var(--gray-50);}

/* ===== People & Teams ===== */
.tabs{display:flex;gap:0.25rem;border-bottom:1px solid var(--color-border-subtle);}
.tab-btn{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 1rem;font-size:0.875rem;font-weight:600;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;color:var(--gray-400);cursor:pointer;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:var(--gray-600);}
.tab-btn--active{border-bottom-color:var(--color-primary);color:var(--color-primary);}

.person-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem;transition:border-color .15s;}
.person-card:hover{border-color:var(--color-border);}
.person-card__top{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1rem;}
.person-card__avatar{width:2.5rem;height:2.5rem;border-radius:var(--radius-full);background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.person-card__avatar span{font-size:0.875rem;font-weight:700;color:var(--gray-600);}
.person-card__info{flex:1;min-width:0;}
.person-card__name-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
.person-card__name{font-size:0.875rem;font-weight:700;color:var(--gray-800);}
.person-card__role{font-size:12px;color:var(--gray-400);margin-top:2px;}
.person-card__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;border-top:1px solid var(--gray-50);padding-top:1rem;}
.person-card__field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:0.25rem;}
.person-card__email{font-size:12px;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.person-card__phone{font-size:12px;color:var(--gray-400);}
.person-card__wo-count{font-size:1.5rem;font-weight:700;color:var(--gray-900);}
.person-card__certs{margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.375rem;}
.cert-pill{font-size:11px;padding:0.125rem 0.5rem;background:var(--gray-100);color:var(--gray-600);border-radius:var(--radius-full);border:1px solid var(--color-border);}

/* ===== Detail Drawer (generic) ===== */
.drawer-overlay{position:fixed;inset:0;z-index:60;display:flex;}
.drawer-overlay[hidden]{display:none;}
.drawer-overlay__backdrop{flex:1;background:rgba(0,0,0,0.2);cursor:pointer;}
.drawer{width:480px;max-width:100%;background:#fff;border-left:1px solid var(--color-border-subtle);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,0.12);overflow:hidden;margin-left:auto;}
@media (max-width:640px){.drawer{width:100%;}}
.drawer__header{padding:1.25rem 1.75rem;border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
.drawer__id{font-size:12px;color:var(--gray-400);margin:0 0 0.25rem;}
.drawer__title{font-size:1rem;font-weight:700;color:var(--gray-900);line-height:1.375;}
.drawer__close{padding:0.375rem;border-radius:var(--radius-lg);background:none;border:none;color:var(--gray-400);cursor:pointer;flex-shrink:0;display:flex;}
.drawer__close:hover{background:var(--gray-100);}
.drawer__body{flex:1;overflow-y:auto;padding:1.5rem 1.75rem;display:flex;flex-direction:column;gap:1.75rem;}
.drawer__badges{display:flex;gap:0.5rem;flex-wrap:wrap;}
.drawer__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem 2rem;}
.drawer__field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);font-weight:600;margin:0 0 0.25rem;}
.drawer__field-value{font-size:0.875rem;color:var(--gray-800);}
.drawer__section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);font-weight:600;margin:0 0 0.5rem;}
.drawer__desc{font-size:0.875rem;color:var(--gray-600);line-height:1.625;}
.drawer__rows{border:1px solid var(--color-border-subtle);border-radius:var(--radius-xl);}
.drawer__row{padding:0.75rem 1rem;display:flex;justify-content:space-between;gap:1rem;font-size:0.875rem;border-bottom:1px solid var(--gray-50);}
.drawer__row:last-child{border-bottom:none;}
.drawer__row span:first-child{color:var(--gray-500);flex-shrink:0;}
.drawer__row span:last-child{color:var(--gray-900);font-weight:600;text-align:right;}
@media (max-width:480px){.drawer__grid{grid-template-columns:1fr;}}

/* ===== Modal (centered) ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay--open{display:flex;}
.modal-box{background:#fff;width:100%;max-width:560px;border-radius:var(--radius-2xl);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal-box__header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--color-border-subtle);position:sticky;top:0;background:#fff;z-index:1;}
.modal-box__title{font-size:1rem;font-weight:700;color:var(--gray-900);}
.modal-box__close{padding:0.375rem;border-radius:var(--radius-lg);background:var(--gray-50);border:1px solid var(--color-border);color:var(--gray-500);cursor:pointer;display:flex;}
.modal-box__close:hover{background:var(--gray-100);}
.modal-box__body{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;}
.modal-box__footer{padding:1.25rem 1.5rem;border-top:1px solid var(--color-border-subtle);display:flex;gap:0.75rem;}

/* ===== Form fields ===== */
.field{display:flex;flex-direction:column;gap:0.375rem;}
.field__label{font-size:12px;font-weight:600;color:var(--gray-600);}
.field-input,.field-select,.field-textarea{font-family:var(--font-sans);font-size:0.875rem;color:var(--gray-800);background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.625rem 0.875rem;outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(21,94,239,.1);}
.field-textarea{resize:vertical;min-height:80px;}
.field-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
@media(max-width:560px){.field-grid-3{grid-template-columns:1fr;}}

/* Area 3-way tabs */
.area-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0.375rem;background:var(--gray-50);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:4px;}
.area-tab{border:none;background:transparent;border-radius:9px;padding:0.625rem 0.375rem;text-align:center;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--gray-400);display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;}
.area-tab:hover{background:#fff;color:var(--gray-700);}
.area-tab--active{background:#fff;box-shadow:var(--shadow-sm);}
.area-tab--active.area-tab--blue{color:var(--blue-600);}
.area-tab--active.area-tab--green{color:var(--green-600);}
.area-tab--active.area-tab--amber{color:var(--amber-600);}

/* Searchable combo */
.combo{position:relative;}
.combo__input-row{display:flex;align-items:center;gap:0.5rem;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.625rem 0.875rem;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.combo.open .combo__input-row{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(21,94,239,.1);border-radius:var(--radius-xl) var(--radius-xl) 0 0;}
.combo__input{flex:1;border:none;background:transparent;outline:none;font-size:0.875rem;color:var(--gray-800);min-width:0;}
.combo__input::placeholder{color:var(--gray-300);}
.combo__chevron{color:var(--gray-400);font-size:11px;flex-shrink:0;transition:transform .2s;display:flex;}
.combo.open .combo__chevron{transform:rotate(180deg);}
.combo__dropdown{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--color-primary);border-top:none;border-radius:0 0 var(--radius-xl) var(--radius-xl);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:300;max-height:220px;overflow-y:auto;}
.combo.open .combo__dropdown{display:block;}
.combo__option{padding:0.625rem 0.875rem;font-size:0.875rem;color:var(--gray-700);cursor:pointer;transition:background-color .1s;}
.combo__option:hover{background:var(--blue-50);}
.combo__option--selected{background:var(--blue-50);color:var(--color-primary);font-weight:700;}
.combo__empty{padding:0.75rem;font-size:0.8125rem;color:var(--gray-400);text-align:center;}

/* Multiselect (teknisi) */
.multiselect{position:relative;}
.multiselect__input-row{display:flex;align-items:center;gap:0.5rem;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:0.5rem 0.875rem;cursor:pointer;min-height:2.625rem;transition:border-color .15s,box-shadow .15s;}
.multiselect.open .multiselect__input-row{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(21,94,239,.1);border-radius:var(--radius-xl) var(--radius-xl) 0 0;}
.multiselect__selected{flex:1;display:flex;flex-wrap:wrap;gap:0.375rem;align-items:center;}
.multiselect__placeholder{font-size:0.875rem;color:var(--gray-300);}
.multiselect__chip{display:inline-flex;align-items:center;gap:0.25rem;background:var(--blue-50);color:var(--color-primary);border:1px solid var(--blue-100);border-radius:var(--radius-lg);padding:0.125rem 0.5rem;font-size:12px;font-weight:700;}
.multiselect__chip-remove{cursor:pointer;font-size:10px;opacity:.7;}
.multiselect__chip-remove:hover{opacity:1;}
.multiselect__chevron{color:var(--gray-400);font-size:11px;flex-shrink:0;transition:transform .2s;display:flex;}
.multiselect.open .multiselect__chevron{transform:rotate(180deg);}
.multiselect__dropdown{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--color-primary);border-top:none;border-radius:0 0 var(--radius-xl) var(--radius-xl);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:300;max-height:220px;overflow-y:auto;}
.multiselect.open .multiselect__dropdown{display:block;}
.multiselect__option{display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.875rem;font-size:0.875rem;color:var(--gray-700);cursor:pointer;transition:background-color .1s;}
.multiselect__option:hover{background:var(--blue-50);}
.multiselect__check{width:1.125rem;height:1.125rem;border:1.5px solid var(--color-border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;transition:all .15s;}
.multiselect__option--checked .multiselect__check{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.multiselect__option--checked{font-weight:700;color:var(--gray-900);}

/* Activity card (shift log) */
.activity-card{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.125rem 1.25rem;transition:border-color .15s;animation:fadeUp .2s ease both;}
.activity-card:hover{border-color:var(--color-border);}
.activity-card__top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.75rem;margin-bottom:0.875rem;}
.activity-card__machine{font-size:0.9375rem;font-weight:700;color:var(--gray-900);margin-top:0.375rem;}
.activity-card__btns{display:flex;gap:0.375rem;flex-shrink:0;}
.icon-btn{width:2rem;height:2rem;border:1px solid var(--color-border);background:var(--gray-50);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-400);transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gray-100);color:var(--gray-700);}
.icon-btn--drag{cursor:grab;touch-action:none;}
.icon-btn--drag:active{cursor:grabbing;}
.icon-btn--danger:hover{background:var(--red-50);color:var(--red-600);border-color:var(--red-100);}
.icon-btn--warn:hover{background:var(--amber-50);color:var(--amber-600);border-color:var(--amber-100);}
.activity-card__divider{border:none;border-top:1px solid var(--color-border-subtle);margin:0.75rem 0;}
.activity-card__field-label{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:0.375rem;}
.activity-card__field-value{font-size:0.8125rem;color:var(--gray-600);line-height:1.6;margin-bottom:0.5rem;}
.activity-action-item{display:flex;align-items:flex-start;gap:0.5rem;margin-bottom:0.25rem;font-size:0.8125rem;color:var(--gray-600);}
.activity-action-num{min-width:1.125rem;height:1.125rem;background:var(--blue-50);color:var(--color-primary);border-radius:4px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;flex-shrink:0;}
.activity-card.sortable-ghost{opacity:.35;border:2px dashed var(--color-primary);background:var(--blue-50);}
.activity-card.sortable-chosen{box-shadow:0 8px 32px rgba(21,94,239,.15);}
.activity-card.sortable-drag{box-shadow:0 16px 48px rgba(21,94,239,.2)!important;transform:scale(1.01);}
body.is-dragging{overflow:hidden;}

.action-row{display:flex;align-items:center;gap:0.5rem;}
.action-row__num{min-width:1.5rem;height:1.5rem;background:var(--blue-50);color:var(--color-primary);border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.action-row input{flex:1;min-width:0;}
.action-row-del{width:1.875rem;height:1.875rem;flex-shrink:0;border:1px solid var(--color-border);background:var(--gray-50);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-400);transition:all .15s;}
.action-row-del:hover{background:var(--red-50);color:var(--red-600);border-color:var(--red-100);}
.btn-add-action{width:100%;display:flex;align-items:center;justify-content:center;gap:0.375rem;background:var(--gray-50);color:var(--gray-500);border:1.5px dashed var(--color-border);border-radius:var(--radius-xl);padding:0.625rem;font-family:var(--font-sans);font-size:0.8125rem;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-add-action:hover{background:var(--blue-50);color:var(--color-primary);border-color:var(--blue-400);}

/* Checklist */
.checklist{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);overflow:hidden;}
.checklist__header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;transition:background-color .15s;user-select:none;}
.checklist__header:hover{background:var(--gray-50);}
.checklist__header-left{display:flex;align-items:center;gap:0.75rem;}
.checklist__icon{width:2.125rem;height:2.125rem;background:var(--blue-50);color:var(--color-primary);border-radius:var(--radius-xl);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.checklist__title{font-size:0.875rem;font-weight:700;color:var(--gray-900);}
.checklist__sub{font-size:12px;color:var(--gray-400);margin-top:1px;}
.checklist__chevron{color:var(--gray-400);transition:transform .25s;display:flex;flex-shrink:0;}
.checklist--open .checklist__chevron{transform:rotate(180deg);}
.checklist__body{display:none;border-top:1px solid var(--color-border-subtle);padding:0.5rem 0.75rem 0.75rem;}
.checklist--open .checklist__body{display:block;}
.checklist__item{display:flex;align-items:center;gap:0.75rem;padding:0.625rem;border-radius:var(--radius-lg);cursor:pointer;transition:background-color .12s;}
.checklist__item:hover{background:var(--gray-50);}
.checklist__box{width:1.25rem;height:1.25rem;flex-shrink:0;border:1.5px solid var(--color-border);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:transparent;}
.checklist__item--checked .checklist__box{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.checklist__label{font-size:0.875rem;color:var(--gray-600);flex:1;transition:color .15s;}
.checklist__item--checked .checklist__label{color:var(--gray-900);font-weight:700;}

/* Submit bar + publish progress */
.submit-bar{background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xl);padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.submit-bar__title{font-size:0.875rem;font-weight:700;color:var(--gray-900);}
.submit-bar__sub{font-size:12px;color:var(--gray-400);margin-top:2px;}
.btn-publish{position:relative;overflow:hidden;}
.btn-publish__bar{position:absolute;inset:0;width:0%;background:rgba(255,255,255,.2);transition:width .35s cubic-bezier(.4,0,.2,1);pointer-events:none;}
.btn-publish__bar--success{background:rgba(255,255,255,.35);width:100%!important;}

function computeNavBadge(id){
  if(id==='work-orders') return workOrders.filter(function(w){return w.status!=='selesai';}).length;
  if(id==='pm') return pmTasks.filter(function(p){return p.status==='overdue';}).length || null;

}

/* ---- Teknisi multiselect ---- */
function renderTekDropdown(){
  document.getElementById('tekList').innerHTML = tekOptions.map(function(name){
    const checked = selectedTeknisi.indexOf(name) > -1;
    return '<div class="multiselect__option'+(checked?' multiselect__option--checked':'')+'" data-tek="'+name+'"><div class="multiselect__check">'+(checked?icon('check',11):'')+'</div>'+esc(name)+'</div>';
  }).join('');
}
function updateTekDisplay(){
  const sel = document.getElementById('tekSelected');
  document.getElementById('slTeknisi').value = selectedTeknisi.join(', ');
  saveHeader();
  if(selectedTeknisi.length===0){ sel.innerHTML = '<span class="multiselect__placeholder">Pilih teknisi...</span>'; return; }
  sel.innerHTML = selectedTeknisi.map(function(n){ return '<span class="multiselect__chip">'+esc(n)+'<span class="multiselect__chip-remove" data-remove-tek="'+n+'">'+icon('x',9)+'</span></span>'; }).join('');
}
function toggleTeknisi(name){ const i = selectedTeknisi.indexOf(name); if(i===-1) selectedTeknisi.push(name); else selectedTeknisi.splice(i,1); renderTekDropdown(); updateTekDisplay(); }
document.addEventListener('click', function(e){
  const tekWrapper = document.getElementById('tekWrapper');
  if(tekWrapper){
    if(e.target.closest('#tekInputRow')){ tekWrapper.classList.toggle('open'); if(tekWrapper.classList.contains('open')) renderTekDropdown(); }
    else if(!tekWrapper.contains(e.target)){ tekWrapper.classList.remove('open'); }
    const remove = e.target.closest('[data-remove-tek]');
    if(remove){ e.stopPropagation(); selectedTeknisi = selectedTeknisi.filter(function(n){return n!==remove.getAttribute('data-remove-tek');}); renderTekDropdown(); updateTekDisplay(); }
    const opt = e.target.closest('#tekList [data-tek]');
    if(opt){ toggleTeknisi(opt.getAttribute('data-tek')); }
  }
});

function updateMesinCombo(preselect){
  document.getElementById('mesinComboValue').value = preselect || '';
  document.getElementById('mesinComboInput').value = preselect || '';

}
function renderMesinComboList(query, selected){
  const list = mesinLists[selectedArea] || [];
  const q = (query||'').toLowerCase().trim();
  const filtered = q ? list.filter(function(x){ return x.toLowerCase().indexOf(q) > -1; }) : list;
  const container = document.getElementById('mesinComboList');
  if(filtered.length===0){ container.innerHTML = '<div class="combo__empty">Tidak ditemukan</div>'; return; }
  const sel = selected !== undefined ? selected : document.getElementById('mesinComboValue').value;
  container.innerHTML = filtered.map(function(name){
    return '<div class="combo__option'+(name===sel?' combo__option--selected':'')+'" data-mesin="'+name.replace(/"/g,'&quot;')+'">'+highlightText(name,q)+'</div>';
  }).join('');

function initSortableActivities(){
  const el = document.getElementById('slActivityGrid'); if(!el) return;
  if(sortableActivities) sortableActivities.destroy();
  sortableActivities = Sortable.create(el, {
    handle:'.icon-btn--drag', animation:200, ghostClass:'sortable-ghost', chosenClass:'sortable-chosen', dragClass:'sortable-drag', delay:80, delayOnTouchOnly:true, touchStartThreshold:3,
    onStart:function(){ document.body.classList.add('is-dragging'); },
    onEnd:function(evt){
      document.body.classList.remove('is-dragging');
      if(evt.oldIndex===evt.newIndex) return;
      const moved = activities.splice(evt.oldIndex,1)[0];
      activities.splice(evt.newIndex,0,moved);
      saveShiftLogToLocal(); renderActivityGrid();
    }
  });
}

function generateReport(){
  const tanggal = document.getElementById('slTanggal').value;
  const date = new Date(tanggal);
  const hari = date.toLocaleDateString('id-ID',{weekday:'long'});
  const tgl = date.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  const shift = document.getElementById('slShift').value;
  let text = hari+', '+tgl+', '+shift+'\n';
  const grouped = {};
  activities.forEach(function(a){ if(!grouped[a.area]) grouped[a.area]={}; if(!grouped[a.area][a.mesin]) grouped[a.area][a.mesin]=[]; grouped[a.area][a.mesin].push(a); });
  for(const area in grouped){
    text += '\n*'+area+'*\n';
    for(const mesin in grouped[area]){
      text += '**'+mesin+'*\n';
      grouped[area][mesin].forEach(function(d){ text += '> '+d.downtime+'\n'; d.action.split('\n').forEach(function(l){ if(l.trim()) text += ' - '+l+'\n'; }); });
    }
  }
  const checked = checkedItems.map(function(i){ return checklistItems[i]; });
  if(checked.length>0){ text += '\n'; checked.forEach(function(label){ text += '*'+label+'\n'; }); }
  document.getElementById('reportText').value = text;
}
document.getElementById('copyReportBtn').addEventListener('click', function(){
  const el = document.getElementById('reportText');
  if(navigator.clipboard) navigator.clipboard.writeText(el.value); else { el.select(); document.execCommand('copy'); }
  alert('Tersalin!');
});
function setPublishProgress(pct, labelHtml){
  const bar = document.getElementById('publishBar'); const lbl = document.getElementById('publishLabel');
  bar.style.width = pct+'%'; if(labelHtml!==undefined) lbl.innerHTML = labelHtml;
}
document.getElementById('publishBtn').addEventListener('click', async function(){
  const btn = this; const bar = document.getElementById('publishBar');
  bar.className = 'btn-publish__bar'; btn.disabled = true;
  const steps = [ {pct:15,ms:200,html:icon('activity',13)+' Menyiapkan...'}, {pct:35,ms:280,html:icon('rotateCw',13)+' Menghubungkan...'}, {pct:60,ms:240,html:icon('send',13)+' Mengirim...'} ];
  for(const s of steps){ setPublishProgress(s.pct, s.html); await delay(s.ms); }
  const tanggal = document.getElementById('slTanggal').value, shift = document.getElementById('slShift').value, teknisi = document.getElementById('slTeknisi').value;
  const data = activities.map(function(a){ return { tanggal:tanggal, shift:shift, teknisi:teknisi, area:a.area, mesin:a.mesin, downtime:a.downtime, action:a.action }; });
  try {
    await fetch(scriptURL, { method:'POST', body: JSON.stringify(data) });
    setPublishProgress(85, icon('checkCircle2',13)+' Menyimpan...'); await delay(300);
    setPublishProgress(100, icon('check',13)+' Berhasil!'); bar.classList.add('btn-publish__bar--success'); await delay(1000);
    activities = []; checkedItems = []; lsRemove('activities'); lsRemove('checkedItems');
    renderActivityGrid(); renderChecklistUI(); closeReportModal();
    bar.className = 'btn-publish__bar'; bar.style.width='0%'; document.getElementById('publishLabel').innerHTML = icon('send',14)+' Publish';
  } catch(e) {
    setPublishProgress(100, icon('x',13)+' Gagal!'); bar.classList.add('btn-publish__bar--error'); await delay(2000);
    bar.className = 'btn-publish__bar'; bar.style.width='0%'; document.getElementById('publishLabel').innerHTML = icon('send',14)+' Publish';
  }
  btn.disabled = false;
});
document.getElementById('publishLabel').innerHTML = icon('send',14)+' Publish';

function spParseGviz(text){
  const start = text.indexOf('{'), end = text.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('Format response tidak valid');
  const obj = JSON.parse(text.slice(start, end+1));
  const cols = obj.table.cols.map(function(c){ return c.label.trim(); });
  const rows = obj.table.rows || [];
  return rows.map(function(row){
    const cells = row.c || []; const raw = {};
    cols.forEach(function(label,i){ raw[label] = cells[i] ? (cells[i].v==null?'':cells[i].v) : ''; });
    const str = function(k){ return String(raw[k]==null?'':raw[k]).trim(); };
    const num = function(k){ return parseFloat(String(raw[k]==null?'0':raw[k]).replace(/[^0-9.-]/g,'')) || 0; };
    const int_ = function(k){ return parseInt(raw[k]||0) || 0; };
    return { noSap:str('No SAP'), nama:str('Nama Material'), stock:num('Stock'), sat:str('Satuan')||'PC', harga:num('Harga @'), totalVal:num('Total Value'), llt:int_('Last Lead Time Ord.'), mapping:str('Mapping'), dist:str('Distribution 6M'), jenis:str('Jenis Barang'), mesin:str('Mesin'), area:str('Area'), racking:str('Racking') };
  }).filter(function(r){ return r.nama; });
}
function spLoadingMsg(html){ document.getElementById('spTbody').innerHTML = '<div class="state-loading">'+coloredIcon('loader',26,'#155eef')+'<div>'+html+'</div></div>'; }
function spErrorMsg(html){ document.getElementById('spTbody').innerHTML = '<div class="state-empty state-error">'+coloredIcon('alertTriangle',26,'#D97706')+html+'</div>'; }

async function loadSparepart(forceRefresh){
  const btn = document.getElementById('btnSpRefresh'); btn.querySelector('svg').classList.add('spin'); btn.disabled = true;
  try {
    const cached = JSON.parse(localStorage.getItem(SP_CACHE_KEY) || 'null');
    if(cached && cached.data.length){
      spData = cached.data; spApplyFilters(); updateOverview();
      const age = Math.round((Date.now()-cached.ts)/60000);
      if(!forceRefresh && (Date.now()-cached.ts) < SP_CACHE_TTL){ btn.querySelector('svg').classList.remove('spin'); btn.disabled=false; return; }
      const warn = document.getElementById('spStaleWarning');
      if(warn && forceRefresh){ warn.textContent = 'Memperbarui data... (cache '+age+' menit lalu)'; warn.classList.add('stale-banner--show'); }
    } else { spLoadingMsg('Memuat data sparepart...'); }
  } catch(e){ spLoadingMsg('Memuat data sparepart...'); }

  const url = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(SP_SHEET_NAME)+'&t='+Date.now();
  let text = null, lastErr = '';
  try {
    const ctrl = new AbortController(); const timer = setTimeout(function(){ctrl.abort();}, FETCH_TIMEOUT_MS);
    const res = await fetch(url, { signal: ctrl.signal }); clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP '+res.status);
    text = await res.text();
  } catch(err){ lastErr = err.name==='AbortError' ? 'Koneksi timeout' : err.message; }
  btn.querySelector('svg').classList.remove('spin'); btn.disabled = false;

  if(!text){
    const warn = document.getElementById('spStaleWarning');
    if(spData.length){ if(warn){ warn.textContent = '⚠ Gagal memperbarui ('+lastErr+'). Menampilkan data sebelumnya.'; warn.classList.add('stale-banner--show'); } }
    else { if(warn) warn.classList.remove('stale-banner--show'); spErrorMsg('<p style="color:#D97706;font-weight:700">Gagal memuat data</p><p style="font-size:12px">'+esc(lastErr)+'</p>'); }
    return;
  }
  let parsed;
  try { parsed = spParseGviz(text); } catch(err){
    lastErr = err.message; const warn = document.getElementById('spStaleWarning');
    if(spData.length){ if(warn){ warn.textContent='⚠ Gagal membaca data ('+lastErr+').'; warn.classList.add('stale-banner--show'); } }
    else { spErrorMsg('<p style="color:#D97706">Gagal membaca data: '+esc(lastErr)+'</p>'); }
    return;
  }
  try { localStorage.setItem(SP_CACHE_KEY, JSON.stringify({ ts:Date.now(), data:parsed })); } catch(e){}
  const warn = document.getElementById('spStaleWarning'); if(warn) warn.classList.remove('stale-banner--show');
  spData = parsed; state.parts.page=1; spApplyFilters(); updateOverview();
}

let rhData = { weekLabels: [], machines: [] };
let rhFiltered = [];

function renderMetersShell(){

    + '<div class="cards-2col" id="rhCards"></div>';
}
function rhIsNumeric(v){ if(v===''||v==null) return false; return /^-?\d+(\.\d+)?$/.test(String(v).trim()); }
function rhIsDateLike(v){
  if(v===''||v==null) return false;
  const s = String(v).trim();
  return /^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(s) || /^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(s) || /^\d{1,2}\s+[A-Za-z]+\s+\d{4}$/.test(s);
}
const RH_UNIT_LABEL = { jam:'jam', kali:'kali', tanggal:'tanggal' };
function rhDetectUnit(weeksObj, isMain){
  const vals = Object.keys(weeksObj||{}).map(function(k){ return weeksObj[k]; }).filter(function(v){ return v!==''&&v!=null; });
  if(vals.some(rhIsDateLike)) return 'tanggal';
  return isMain ? 'jam' : 'kali';
}
function rhNormalizeUnitLabel(raw){
  const s = String(raw||'').trim().toLowerCase();
  if(!s) return null;
  if(s.indexOf('date')>-1 || s.indexOf('tanggal')>-1 || s.indexOf('tgl')>-1) return 'tanggal';
  if(s.indexOf('count')>-1 || s.indexOf('kali')>-1 || s.indexOf('cycle')>-1 || s.indexOf('siklus')>-1) return 'kali';
  if(s.indexOf('hour')>-1 || s.indexOf('jam')>-1) return 'jam';
  return null;
}
function rhUnitOf(row, isMain){
  if(row && row.unit && RH_UNIT_LABEL[row.unit]) return row.unit;
  return rhDetectUnit(row ? row.weeks : {}, isMain);
}
function rhFormatValue(v, unit){
  if(v===''||v==null) return '—';
  if(unit==='tanggal') return esc(v);
  return esc(v)+' '+RH_UNIT_LABEL[unit];
}
function rhParseGviz(text){
  const start=text.indexOf('{'), end=text.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('Format response tidak valid');
  const obj = JSON.parse(text.slice(start,end+1));
  if(obj.status==='error'){ const msg=(obj.errors&&obj.errors[0]&&(obj.errors[0].detailed_message||obj.errors[0].message))||'Unknown gviz error'; throw new Error('Google Sheets: '+msg); }
  if(!obj.table||!obj.table.cols) throw new Error('Tab "Running Hour" tidak ditemukan atau kosong');
  const cols = obj.table.cols.map(function(c){ return (c.label||'').trim(); });
  const rows = obj.table.rows || [];
  /* Locate Area / Nama Mesin / Unit by header name (not fixed position), so an added
     "Unit" column anywhere in the sheet doesn't shift the week columns. Everything
     else is treated as a week column, in its original left-to-right order. */
  const areaIdx = cols.findIndex(function(l){ return /^area$/i.test(l); });
  const namaIdx = cols.findIndex(function(l){ return /nama/i.test(l); });
  const unitIdx = cols.findIndex(function(l){ return /^unit$/i.test(l); });
  const metaIdx = [areaIdx, namaIdx, unitIdx].filter(function(i){ return i>-1; });
  const weekIdxList = cols.map(function(l,i){ return i; }).filter(function(i){ return metaIdx.indexOf(i)===-1 && cols[i]; });
  const rawRows = rows.map(function(row){
    const cells = row.c || [];
    const cellStr = function(idx){ return (idx>-1 && cells[idx] && cells[idx].v!=null) ? String(cells[idx].v).trim() : ''; };
    const area = areaIdx>-1 ? cellStr(areaIdx) : '';
    const nama = namaIdx>-1 ? cellStr(namaIdx) : cellStr(1);
    const unit = unitIdx>-1 ? rhNormalizeUnitLabel(cellStr(unitIdx)) : null;
    const weeks = {};
    weekIdxList.forEach(function(idx){ const label=cols[idx]; if(!label) return; const cell=cells[idx]; const f=cell?cell.f:undefined; const v=cell?cell.v:''; weeks[label] = (f!=null&&f!=='') ? f : (v==null?'':v); });
    return { area:area, nama:nama, unit:unit, weeks:weeks };
  }).filter(function(r){ return r.nama; });
  const weekCols = weekIdxList.map(function(i){ return cols[i]; });
  const machines = []; let currentParent = null;
  rawRows.forEach(function(r){
    const isSub = r.nama.indexOf('-')===0;
    if(isSub && currentParent) currentParent.subs.push({ label:r.nama.replace(/^-+\s*/,''), weeks:r.weeks, unit:r.unit });
    else { currentParent = { area:r.area, nama:r.nama, weeks:r.weeks, unit:r.unit, subs:[] }; machines.push(currentParent); }
  });
  return { weekLabels: weekCols.filter(Boolean), machines: machines };
}
function rhLatestInfo(m){
  const weeks = rhData.weekLabels;

  return { label:null, value:null, prevValue:null };
}
function rhGuessNextWeekLabel(){
  const weeks = rhData.weekLabels; if(!weeks.length) return '';
  const last = weeks[weeks.length-1]; const m = last.match(/^(\D*)(\d+)(\D*)$/); if(!m) return '';

}

function rhBuildChartSVG(labels, values){
  const n=labels.length, w=Math.max(320,n*56), h=170, pad={top:18,right:16,bottom:26,left:16};
  const plotW=w-pad.left-pad.right, plotH=h-pad.top-pad.bottom;
  const min=Math.min.apply(null,values), max=Math.max.apply(null,values), range=(max-min)||1;
  const pts = values.map(function(v,i){ const x=pad.left+(n===1?plotW/2:(i/(n-1))*plotW); const y=pad.top+plotH-((v-min)/range)*plotH; return {x:x,y:y,v:v,label:labels[i]}; });
  const linePath = pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
  const floorY = (pad.top+plotH).toFixed(1);
  const areaPath = linePath+' L'+pts[pts.length-1].x.toFixed(1)+','+floorY+' L'+pts[0].x.toFixed(1)+','+floorY+' Z';
  const dotsAndLabels = pts.map(function(p){ return '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-9).toFixed(1)+'" font-size="10" font-weight="700" text-anchor="middle" fill="#111827" font-family="Inter, sans-serif">'+p.v+'</text><circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#155eef" stroke="#ffffff" stroke-width="1.5"></circle><text x="'+p.x.toFixed(1)+'" y="'+(h-8).toFixed(1)+'" font-size="9" text-anchor="middle" fill="#9ca3af" font-family="Inter, sans-serif">'+p.label+'</text>'; }).join('');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="display:block"><path d="'+areaPath+'" fill="rgba(21,94,239,0.10)" stroke="none"></path><path d="'+linePath+'" fill="none" stroke="#155eef" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>'+dotsAndLabels+'</svg>';
}

function poprParseGviz(text){
  const start=text.indexOf('{'), end=text.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('Format response tidak valid');
  const obj = JSON.parse(text.slice(start,end+1));
  if(obj.status==='error'){ const msg=(obj.errors&&obj.errors[0]&&(obj.errors[0].detailed_message||obj.errors[0].message))||'Unknown gviz error'; throw new Error('Google Sheets: '+msg); }
  if(!obj.table) throw new Error('Tab "PRPO" tidak ditemukan atau kosong');
  const rows = obj.table.rows || [];
  const get = function(cells, idx){ const cell=cells[idx]; if(!cell) return ''; if(cell.f!=null&&cell.f!=='') return cell.f; return cell.v==null?'':cell.v; };
  return rows.map(function(row){
    const cells = row.c || []; const r = {};
    Object.keys(POPR_COLS).forEach(function(key){ r[key] = poprCell(get(cells, POPR_COLS[key])); });
    r.qtyNum = parseFloat(String(r.qty).replace(/[^0-9.-]/g,'')) || 0;
    r.received = r.tglBarang !== '';
    return r;
  }).filter(function(r){ return r.noPr || r.noPo || r.deskripsi; });
}

  }
  try { localStorage.setItem(POPR_CACHE_KEY, JSON.stringify({ ts:Date.now(), data:parsed })); } catch(e){}
  const warn = document.getElementById('poprStaleWarning'); if(warn) warn.classList.remove('stale-banner--show');
  poprData = parsed; state.popr.page=1; poprBuildFilterOptions(); poprApplyFilters(); updateOverview();
}
function poprBuildFilterOptions(){
  const sel = document.getElementById('poprMapping'); if(!sel) return;
  const current = sel.value;
  const opts = Array.from(new Set(poprData.map(function(r){return r.mapping;}).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">Semua Mapping</option>' + opts.map(function(m){ return '<option value="'+m.replace(/"/g,'&quot;')+'">'+esc(m)+'</option>'; }).join('');
  if(opts.indexOf(current)>-1) sel.value = current;
}
function poprStatusBadge(r){ return r.received ? badge('Diterima','green') : badge('Pending','amber'); }
function poprMappingBadge(m){ if(!m) return '—'; return badge(m, m==='PM'?'blue':'gray'); }
function poprApplyFilters(){
  const q = document.getElementById('poprQ') ? document.getElementById('poprQ').value.toLowerCase() : '';
  const fMap = document.getElementById('poprMapping') ? document.getElementById('poprMapping').value : '';
  const fStatus = state.popr.status;
  poprFiltered = poprData.filter(function(r){
    if(q && (r.noPr+' '+r.noPo+' '+r.deskripsi+' '+r.kodePpm).toLowerCase().indexOf(q)===-1) return false;
    if(fMap && r.mapping!==fMap) return false;
    if(fStatus==='pending' && r.received) return false;
    if(fStatus==='diterima' && !r.received) return false;
    return true;
  });
  state.popr.page = 1;
  if(state.popr.sortCol) poprDoSort(state.popr.sortCol,false); else poprRender();
  const stats = document.getElementById('poprStats');
  if(stats){
    const pending=poprData.filter(function(p){return !p.received;}).length, received=poprData.filter(function(p){return p.received;}).length;
    stats.innerHTML = '<div class="stat-card stat-card--amber"><div class="stat-card__count">'+pending+'</div><div class="stat-card__label">Pending</div></div><div class="stat-card stat-card--green"><div class="stat-card__count">'+received+'</div><div class="stat-card__label">Diterima</div></div><div class="stat-card stat-card--blue"><div class="stat-card__count">'+poprData.length+'</div><div class="stat-card__label">Total Item</div></div>';
  }
}
function poprDoSort(col, reRender){
  const dir = state.popr.sortDir;
  poprFiltered.sort(function(a,b){
    let av,bv;
    if(col==='qty'){ av=a.qtyNum; bv=b.qtyNum; } else if(col==='tglBarang'){ av=a.received?1:0; bv=b.received?1:0; } else { av=a[col]||''; bv=b[col]||''; }
    if(typeof av==='number') return (av-bv)*dir; return String(av).localeCompare(String(bv))*dir;
  });
  if(reRender){ state.popr.page=1; poprRender(); }
}
function poprRender(){
  const start=(state.popr.page-1)*POPR_PER_PAGE, slice=poprFiltered.slice(start,start+POPR_PER_PAGE);
  const tbody = document.getElementById('poprTbody'); if(!tbody) return;
  if(poprFiltered.length===0){ tbody.innerHTML = '<div class="state-empty">'+icon('search',26)+'<p>Tidak ada data PO/PR ditemukan</p></div>'; document.getElementById('poprPageInfo').textContent=''; document.getElementById('poprPageBtns').innerHTML=''; return; }
  const q = document.getElementById('poprQ').value.trim();
  tbody.innerHTML = slice.map(function(r,i){
    return '<div class="table__row popr-table__row" data-popr-idx="'+(start+i)+'"><span class="cell-dim">'+esc(r.noPr||'—')+'</span><span class="cell-dim">'+esc(r.noPo||'—')+'</span><div class="cell-title">'+highlightText(r.deskripsi||'—',q)+'</div><span class="cell-text">'+esc(r.qty||'—')+(r.uom?' '+esc(r.uom):'')+'</span>'+poprMappingBadge(r.mapping)+poprStatusBadge(r)+'</div>';
  }).join('');
  poprRenderPagination();
}
function poprRenderPagination(){
  const totalPages=Math.ceil(poprFiltered.length/POPR_PER_PAGE), page=state.popr.page;
  const s=(page-1)*POPR_PER_PAGE+1, e=Math.min(page*POPR_PER_PAGE, poprFiltered.length);
  document.getElementById('poprPageInfo').textContent = fmtInt(s)+'–'+fmtInt(e)+' dari '+fmtInt(poprFiltered.length)+' item';
  let html = '<button data-popr-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>'+icon('chevronLeft',12)+'</button>';
  for(let p=1;p<=totalPages;p++){ if(totalPages<=7||p===1||p===totalPages||Math.abs(p-page)<=1){ html += '<button data-popr-page="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>'; } else if(Math.abs(p-page)===2){ html += '<button disabled style="border:none;background:transparent">…</button>'; } }
  html += '<button data-popr-page="'+(page+1)+'" '+(page===totalPages||totalPages===0?'disabled':'')+'>'+icon('chevronRight',12)+'</button>';
  document.getElementById('poprPageBtns').innerHTML = html;
}
function poprOpenDetail(idx){
  const r = poprFiltered[idx]; if(!r) return;
  const rows = [['No PR',r.noPr],['No PO',r.noPo],['No GR',r.noGr],['WO',r.wo],['Qty',(r.qty||'—')+(r.uom?' '+r.uom:'')],['Kategori',r.kategori],['Purpose',r.purpose],['Penawaran',r.penawaran],['Tgl Terima PR',r.tglTerimaPr],['Tgl PR',r.tglPr],['Tgl Release',r.tglRelease],['Lead Time PR',r.leadTimePr],['Tgl PO Release',r.tglPoRelease],['Lead Time PO',r.leadTimePo],['Tgl Barang Datang',r.tglBarang],['Lead Time PR-BD',r.leadTimePrBd],['Confirm Deliv. Date',r.confirmDeliv]]
    .map(function(f){ return '<div class="drawer__row"><span>'+f[0]+'</span><span>'+esc(f[1]||'—')+'</span></div>'; }).join('');
  const html = '<div class="drawer__header"><div><p class="drawer__id">'+esc(r.kodePpm||'—')+'</p><h2 class="drawer__title">'+esc(r.deskripsi||'—')+'</h2></div>'+drawerCloseBtnHtml()+'</div>'
    + '<div class="drawer__body"><div class="drawer__badges">'+poprMappingBadge(r.mapping)+poprStatusBadge(r)+'</div><div class="drawer__rows">'+rows+'</div></div>';
  openDrawer(html);
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnPoprRefresh').addEventListener('click', function(){ loadPoPr(true); });
  document.getElementById('poprQ').addEventListener('input', poprApplyFilters);
  document.getElementById('poprMapping').addEventListener('change', poprApplyFilters);
  document.getElementById('page-purchase-orders').addEventListener('click', function(e){
    const chip = e.target.closest('[data-action="popr-status"]');
    if(chip){ state.popr.status = chip.getAttribute('data-value'); document.querySelectorAll('#poprStatusChips .filter-chip').forEach(function(c){c.classList.toggle('filter-chip--active',c===chip);}); poprApplyFilters(); return; }
    const th = e.target.closest('[data-sort]');
    if(th){ const col=th.getAttribute('data-sort'); if(state.popr.sortCol===col) state.popr.sortDir*=-1; else { state.popr.sortCol=col; state.popr.sortDir=1; } document.querySelectorAll('.popr-table__head span').forEach(function(s){s.classList.remove('sorted');}); th.classList.add('sorted'); poprDoSort(col,true); return; }
    const pbtn = e.target.closest('[data-popr-page]');
    if(pbtn){ const p=Number(pbtn.getAttribute('data-popr-page')); const t=Math.ceil(poprFiltered.length/POPR_PER_PAGE); if(p>=1&&p<=t){ state.popr.page=p; poprRender(); } return; }
    const row = e.target.closest('[data-popr-idx]');
    if(row){ poprOpenDetail(Number(row.getAttribute('data-popr-idx'))); }
  });
});

  renderSidebarNav();

  /* Shift Log init */
  loadHeader(); setTodayIfEmpty(); loadShiftLogFromLocal(); loadChecklist(); renderTekDropdown(); updateTekDisplay(); renderActivityGrid();
  document.getElementById('slTanggal').addEventListener('change', function(){ saveHeader(); updateOverview(); });
  document.getElementById('slShift').addEventListener('change', saveHeader);

  /* Mock-data pages */
  updateWorkOrdersList();
  updatePMList();
  updateAssetsList();

  /* Overview (initial paint; will refresh again once real data loads) */
  updateOverview();

  /* Kick off background loads (cache-first) so Overview KPIs populate even before visiting those tabs */
  loadSparepart(false);
  loadRunningHour(false);
  loadPoPr(false);
});
